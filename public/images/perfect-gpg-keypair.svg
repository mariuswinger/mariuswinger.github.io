  <rect x="24" y="24" width="352" height="212" rx="14" fill="#0f0f12" stroke="#38383f"/>
  <circle cx="46" cy="44" r="5" fill="#fda4af"/>
  <circle cx="64" cy="44" r="5" fill="#f7b733"/>
  <circle cx="82" cy="44" r="5" fill="#6ee7b7"/>
